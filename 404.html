<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>404 — Page Not Found | Humza Mustafa</title>
	<script src="https://kit.fontawesome.com/e9f55b6c60.js" crossorigin="anonymous"></script>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="icon" type="image/jpg" href="img/Icons/favicon.jpg"/>
	<link rel="stylesheet" type="text/css" href="css/style.css">
	<style>
		.error-page {
			min-height: 100vh;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			text-align: center;
			padding: 40px 20px;
			background: linear-gradient(135deg, var(--bg-dark) 0%, #1e1228 50%, var(--bg-dark) 100%);
			position: relative;
			overflow: hidden;
		}

		.error-code {
			font-size: clamp(100px, 20vw, 180px);
			font-weight: 700;
			line-height: 1;
			background: linear-gradient(135deg, var(--accent-orange) 0%, var(--accent-rose) 100%);
			-webkit-background-clip: text;
			-webkit-text-fill-color: transparent;
			background-clip: text;
			letter-spacing: -4px;
			margin-bottom: 0;
		}

		.error-star {
			font-size: 48px;
			color: var(--accent-orange);
			opacity: 0.6;
			margin: 10px 0 24px;
			animation: spin-slow 12s linear infinite;
		}

		@keyframes spin-slow {
			from { transform: rotate(0deg); }
			to   { transform: rotate(360deg); }
		}

		.error-title {
			font-size: 22px;
			color: var(--text-primary);
			letter-spacing: 3px;
			text-transform: uppercase;
			margin-bottom: 14px;
		}

		.error-sub {
			color: var(--text-secondary);
			font-size: 15px;
			max-width: 420px;
			line-height: 1.8;
			margin-bottom: 40px;
		}

		.error-links {
			display: flex;
			gap: 16px;
			flex-wrap: wrap;
			justify-content: center;
		}

		.error-btn {
			display: inline-block;
			padding: 12px 32px;
			border-radius: 50px;
			font-size: 13px;
			letter-spacing: 2px;
			text-transform: uppercase;
			text-decoration: none;
			transition: box-shadow 0.25s, background 0.25s;
		}

		.error-btn-primary {
			background: linear-gradient(135deg, var(--accent-orange), var(--accent-rose));
			color: #fff;
		}

		.error-btn-primary:hover {
			box-shadow: 0 0 24px rgba(232, 132, 74, 0.5);
			color: #fff;
		}

		.error-btn-ghost {
			background: rgba(232, 132, 74, 0.08);
			border: 1.5px solid rgba(232, 132, 74, 0.4);
			color: var(--accent-orange);
		}

		.error-btn-ghost:hover {
			background: rgba(232, 132, 74, 0.15);
			box-shadow: 0 0 16px rgba(232, 132, 74, 0.25);
			color: var(--accent-orange);
		}
	</style>
</head>
<body>

	<div class="error-page">
		<p class="error-code">404</p>
		<div class="error-star">✦</div>
		<h1 class="error-title">Page Not Found</h1>
		<p class="error-sub">
			Looks like this path leads nowhere — even the Sun &amp; Moon system couldn't locate it.
		</p>
		<div class="error-links">
			<a href="index.html" class="error-btn error-btn-primary">Back to Portfolio</a>
			<a href="index.html#contact" class="error-btn error-btn-ghost">Contact Me</a>
		</div>
	</div>

	<script src="js/bg-particles.js"></script>
	<script src="js/cursor.js"></script>

</body>
</html>
